function reconcileLegacyPresets(input,isFresh=false){

  const candidate=buildLegacyMigrationCandidate(input);
  const originalById=new Map(input.stations.map(s=>[s.id,s]));
  if(candidate.stations.length!==input.stations.length||candidate.stations.some(s=>!originalById.has(s.id)))throw Error('迁移候选改变了站点底册，已停止写入');
  const result={...candidate,...clone(input)};
  const conflicts=Array.isArray(input.migrationConflicts)?clone(input.migrationConflicts):[];
  const applied=[];
  const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  // Exact correction documented in PROJECT_HANDOFF section 29; no fuzzy name matching.
  const corrections=[{stationId:'design-2026-026',field:'towerName',from:'肥西皋城路与周公山路交口西',to:'肥西横排头路与将军岭中路交口东南',source:'PROJECT_HANDOFF.md section 29'}];
  result.stations=input.stations.map(original=>{
    const proposal=candidate.stations.find(s=>s.id===original.id),next=clone(original);
    if(isFresh)return clone(proposal); // No local user data: finish the existing seed initialization chain.
    const fields=new Set([...Object.keys(proposal),...corrections.filter(x=>x.stationId===original.id).map(x=>x.field)]);
    for(const field of fields){
      if(['id','lastUpdate','updates','selectionFollowups','pauses','buildEvents','issues'].includes(field))continue;
      const correction=corrections.find(x=>x.stationId===original.id&&x.field===field&&same(original[field],x.from));
      const proposed=correction?correction.to:proposal[field];
      if(proposed===undefined||same(original[field],proposed))continue;
      if(correction||!Object.prototype.hasOwnProperty.call(original,field)){
        next[field]=clone(proposed);
        applied.push({stationId:original.id,field,from:original[field],to:clone(proposed),reason:correction?correction.source:'missing-field'});
      }else if(!['lastUpdate','updates','selectionFollowups','pauses','buildEvents','issues'].includes(field)){
        // false, empty strings, manual dates and terminal states are real values, not missing data.
        conflicts.push({migration:PRESET_SAFETY_VERSION,stationId:original.id,stationName:original.demandName,field,kept:clone(original[field]),proposed:clone(proposed),resolution:'kept-local'});
      }
      // Existing histories and their timestamps are never rewritten by a historical preset.
    }
    return next;
  });
  result.presetSafetyVersion=PRESET_SAFETY_VERSION;
  result.migrationConflicts=conflicts;
  result.migrationAudit=[...(Array.isArray(input.migrationAudit)?clone(input.migrationAudit):[]),{version:PRESET_SAFETY_VERSION,applied,conflicts:conflicts.length}];
  return result;
}

function pendingEstablishText(s){

function riskTags(s,m){

  else if(m.level==='warn'&&!m.nodeOverdue)tags+='<span class="tag o">工期需关注</span> ';
  return tags;
}

function homeRow(s,mode){if(mode==='selection'){const fd=followDays(s),when=fd===9999?'待首次跟进':(fd+'天未更新'),isDiff=!!s.isDifficultSite,label=isDiff?'当前问题':'最新进展',text=isDiff?(s.selectionProblem||s.sourceRemark||'暂无'):latestSelectionProgress(s);return `<div class="hrow" data-open="${esc(s.id)}"><div><div class="name"><span class="tag">${esc(s.operator||'—')}</span> ${esc(s.demandName)}</div><div class="sub">${esc(s.territory||'—')} · ${esc(s.selector||'—')}</div></div><div class="hproblem"><div class="lab">${label}</div><div class="val">${esc(text)}</div></div><div class="hstatus"><span class="tag ${isDiff?'o':''}">${isDiff?'疑难':'正常'}</span> <span class="tag r">${esc(when)}</span></div></div>`}const m=scheduleMeta(s),bd=buildDay(s);return `<div class="hrow ${hasConstructionProblem(s)?'problem-row':''}" data-open="${esc(s.id)}"><div><div class="name">${esc(s.demandName)}</div><div class="sub">${esc(s.operator||'—')} · ${esc(s.territory||'—')}</div></div><div class="hproblem"><div class="lab">${hasConstructionProblem(s)?'施工问题':'当前 / 下一步'}</div><div class="val">${hasConstructionProblem(s)?esc(constructionProblemReason(s)):(esc(m.stage)+(m.next?' · '+esc(m.next):''))}</div></div><div class="hstatus">${riskTags(s,m)}<span class="tag ${m.level==='bad'?'r':m.level==='warn'?'o':'g'}">第${bd??'—'}/48工作日</span></div></div>`}

function holidayNameForDate(s){
  const cal=calendarForDate(s);if(!cal)return '';
  const h=cal.holidays.find(x=>x.off.includes(s)||x.work.includes(s));
  return h?h.name:'';
}
function calendarMonthHtml(year,month){
  const first=new Date(year,month-1,1),last=new Date(year,month,0).getDate(),start=first.getDay();
  const week=['日','一','二','三','四','五','六'];
  const heads=week.map(x=>'<div class="caldow">'+x+'</div>').join('');
  let cells='';
  for(let i=0;i<start;i++)cells+='<div class="calday blank"></div>';
  for(let day=1;day<=last;day++){
    const ds=year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const type=mainlandCalendarDayType(ds),name=holidayNameForDate(ds);
    const badge=type==='holiday'?'休':type==='makeup-work'?'班':'';
    const tip=(name?name+' · ':'')+(type==='holiday'?'法定放假，不计工期':type==='makeup-work'?'调休上班，计入工期':type==='weekend'?'普通周末，不计工期':'工作日，计入工期');
    cells+='<div class="calday '+type+(ds===today()?' today':'')+'" title="'+esc(tip)+'"><span class="calnum">'+day+'</span>'+(badge?'<span class="calbadge">'+badge+'</span>':'')+'</div>';
  }
  return '<section class="calmonth"><div class="calmonth-title">'+year+'年'+month+'月</div><div class="calgrid">'+heads+cells+'</div></section>';
}
function calendarWorkdayStats(year){
  let work=0,weekend=0,holiday=0,makeup=0;
  const d=new Date(year,0,1),end=new Date(year,11,31);
  while(d<=end){
    const ds=localDateStr(d),t=mainlandCalendarDayType(ds);
    if(t==='holiday')holiday++;
    else if(t==='makeup-work'){makeup++;work++}
    else if(t==='weekend')weekend++;
    else if(t==='normal')work++;
    d.setDate(d.getDate()+1);
  }
  return {work,weekend,holiday,makeup};
}

let renderedDay='',pendingRestore=null;
function refreshDay(){
  if(renderedDay===today())return;
  // Detail forms retain their DOM until the user saves, cancels or leaves.
  if(route().page==='station'){
    const status=document.getElementById('dateStatus');
    if(status)status.textContent='今天 '+today()+' · 日期已变化，保存或离开详情后更新计时';
    return;
  }
  render();
}
function renderDailyTools(){
  renderedDay=today();
  const status=document.getElementById('dateStatus');
  if(status)status.textContent='计算日期：'+renderedDay;
  if(route().page!=='home'){
    const preview=document.getElementById('restorePreview');

function validateBackup(text){
  const envelope=JSON.parse(text);
  if(!envelope||envelope.format!=='feixi-full-backup'||envelope.version!==1)throw Error('不是支持的肥西完整备份文件');
  const data=envelope.data,ids=new Set(SEED.stations.map(s=>s.id));
  if(!data||typeof data!=='object'||!Array.isArray(data.stations)||data.stations.length!==ids.size)throw Error('备份必须包含完整75站');
  for(const s of data.stations){
    if(!s||typeof s!=='object'||Array.isArray(s)||!ids.delete(s.id))throw Error('备份站点ID缺失、重复或不属于当前底册');
    for(const k of ['selectionFollowups','updates','pauses','buildEvents','issues'])if(k in s&&!Array.isArray(s[k]))throw Error('历史记录格式异常：'+k);
    for(const k of ['establishDate','entryDate','pourDate','towerDate','powerDate','supportDate','completeDate'])if(s[k]&&!parseDate(s[k]))throw Error('节点日期格式异常：'+k);
  }
  if(data.baseDataVersion!==BASE_VERSION||data.presetSafetyVersion!==PRESET_SAFETY_VERSION)throw Error('备份版本不兼容，请使用本版本下载的完整备份');
  return data;
}
function downloadBackup(){
  if(localStorage.getItem(KEY)!==storageSnapshot)throw Error('另一个页面已更新，请刷新后下载备份');
  const data=JSON.parse(storageSnapshot);
  const blob=new Blob([JSON.stringify({format:'feixi-full-backup',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='肥西完整备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function previewBackup(text){
  pendingRestore=null;
  const data=validateBackup(text),changes=[];
  for(const s of data.stations){const old=stationBy(s.id);for(const k of new Set([...Object.keys(old),...Object.keys(s)]))if(JSON.stringify(old[k])!==JSON.stringify(s[k]))changes.push({name:s.demandName,field:k,before:old[k],after:s[k]});}
  for(const k of new Set([...Object.keys(state),...Object.keys(data)]))if(k!=='stations'&&JSON.stringify(state[k])!==JSON.stringify(data[k]))changes.push({name:'全局设置',field:k,before:state[k],after:data[k]});
  pendingRestore={data,snapshot:storageSnapshot};
  const box=document.getElementById('restorePreview');box.classList.remove('hide');
  box.innerHTML='<div class="alert"><b>恢复完整备份：75站，'+changes.length+'项字段差异</b><p>确认后以备份完整替换当前数据；恢复前会保留当前数据副本。未保存的编辑请先保存。</p><details><summary>查看差异</summary><div style="max-height:320px;overflow:auto;overflow-wrap:anywhere">'+changes.map(x=>'<p><b>'+esc(x.name)+' · '+esc(x.field)+'</b><br>当前：'+esc(JSON.stringify(x.before)??'无')+'<br>备份：'+esc(JSON.stringify(x.after)??'无')+'</p>').join('')+'</div></details><button class="btn primary" id="confirmRestore">确认恢复</button> <button class="btn" id="cancelRestore">取消</button></div>';
  document.getElementById('cancelRestore').onclick=()=>{pendingRestore=null;box.classList.add('hide')};
  document.getElementById('confirmRestore').onclick=()=>{try{restoreBackup();box.classList.add('hide');render()}catch(e){alert(e.message)}};
}
function restoreBackup(){
  if(!pendingRestore)throw Error('请先选择备份');
  if(route().page==='station')throw Error('请先保存或退出站点详情，再恢复备份');
  if(storageSnapshot!==pendingRestore.snapshot||localStorage.getItem(KEY)!==storageSnapshot)throw Error('预览后数据发生变化，请重新选择备份');
  const old=state;
  localStorage.setItem(KEY+':before-restore:'+Date.now(),storageSnapshot);
  state=clone(pendingRestore.data);
  try{save()}catch(e){state=old;throw e}
  pendingRestore=null;
}
function initDailyTools(){
  const backup=document.getElementById('backupData'),restore=document.getElementById('restoreData'),fileInput=document.getElementById('backupFile');
  if(backup)backup.onclick=()=>{try{downloadBackup()}catch(e){alert(e.message)}};
  if(restore&&fileInput)restore.onclick=()=>fileInput.click();
  if(fileInput)fileInput.onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{previewBackup(await file.text())}catch(error){pendingRestore=null;document.getElementById('restorePreview').classList.add('hide');alert('无法恢复：'+error.message)}};
  setInterval(refreshDay,30000);
  window.addEventListener('focus',refreshDay);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});
}
function render(){try{const r=route();if(r.page==='home')renderHome();else if(r.page==='selection')renderList('selection');else if(r.page==='difficult')renderList('difficult');else if(r.page==='pending')renderList('pending');else if(r.page==='building')renderList('building');else if(r.page==='after')renderList('building');else if(r.page==='complete')renderList('complete');else if(r.page==='schedule')renderList('building');else if(r.page.startsWith('calendar'))renderCalendar();else if(r.page==='station')renderStation(r.id);else if(r.page==='search')renderList('all',{q:r.q});else renderHome();renderDailyTools()}catch(e){document.getElementById('app').innerHTML='<div class="err"><b>页面加载失败</b><br>'+esc(e&&e.message||e)+'</div>';console.error(e)}}
try{load()}catch(e){document.getElementById('app').innerHTML='<div class="err">'+esc(e.message)+'</div>';throw e}const app=document.getElementById('app');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const q=document.getElementById('globalSearch').value.trim();if(q)go('search/'+encodeURIComponent(q))};window.addEventListener('hashchange',render);window.addEventListener('error',e=>{const d=document.createElement('div');d.className='err';d.textContent='脚本错误：'+e.message;document.body.prepend(d)});render();initDailyTools();
</script>
