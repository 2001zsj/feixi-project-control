name: Apply CloudBase station updates

on:
  push:
    branches:
      - cloudbase-sync-v1
    paths:
      - 'cloudbase-dist/remote-updates.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser driver
        run: npm install puppeteer-core@24.19.0 --no-save

      - name: Apply queued updates through CloudBase page
        env:
          CLOUDBASE_URLS: https://zsj1314-d9ger6ak4a25a8717-1496070976.tcloudbaseapp.com/fxtt/,https://zsj1314-d9ger6ak4a25a8717-1496070976.tcloudbaseapp.com/
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            page.on('console', msg => console.log('[browser]', msg.type(), msg.text()));
            page.on('pageerror', err => console.log('[pageerror]', err.message));

            const urls = String(process.env.CLOUDBASE_URLS || '').split(',').filter(Boolean);
            let selected = null;
            for (const url of urls) {
              const resp = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
              const title = await page.title();
              const hasCloudSync = await page.evaluate(() => {
                try { return typeof cloudSync !== 'undefined'; } catch (_) { return false; }
              });
              console.log('Probe:', JSON.stringify({url,status:resp && resp.status(),title,hasCloudSync}));
              if (hasCloudSync) { selected = url; break; }
            }
            if (!selected) throw new Error('No deployed CloudBase app page found');

            await page.waitForFunction(() => {
              try {
                return typeof cloudSync !== 'undefined' && (cloudSync.ready || cloudSync.lastError);
              } catch (_) {
                return false;
              }
            }, { timeout: 90000 });

            const before = await page.evaluate(() => ({
              ready: cloudSync.ready,
              empty: cloudSync.empty,
              conflict: cloudSync.conflict,
              lastError: cloudSync.lastError || ''
            }));
            console.log('Cloud status before:', JSON.stringify(before));
            if (!before.ready) throw new Error('CloudBase page is not ready: ' + JSON.stringify(before));

            const result = await page.evaluate(async () => {
              await cloudPollRemoteCommands();
              await new Promise(r => setTimeout(r, 2500));
              return {
                ready: cloudSync.ready,
                conflict: cloudSync.conflict,
                lastError: cloudSync.lastError || '',
                applied: Array.from(cloudSync.remoteAppliedCommands.entries())
              };
            });
            console.log('Cloud update result:', JSON.stringify(result));
            if (result.conflict) throw new Error('CloudBase conflict');
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
