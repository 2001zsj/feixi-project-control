name: Verify CloudBase UI
on:
  push:
    branches: [cloudbase-sync-v1]
    paths:
      - 'cloudbase-dist/index.html'
      - 'tests/cloudbase-sync.cjs'
      - 'tests/module-order.cjs'
      - 'tests/status-rules.cjs'
      - 'tests/focus-rules.cjs'
      - 'tests/consistency-rules.cjs'
      - 'tools/station-rules.cjs'
      - '.github/workflows/apply-cloudbase-updates.yml'
      - '.github/workflows/verify-cloudbase-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/cloudbase-sync.cjs
      - run: node tests/module-order.cjs
      - run: node tests/status-rules.cjs
      - run: node tests/focus-rules.cjs
      - run: node tests/consistency-rules.cjs
