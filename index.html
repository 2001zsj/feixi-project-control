function mergeLatestBase(){
  const old=(state&&Array.isArray(state.stations))?state.stations:[];
  const byId=new Map(old.map(s=>[s.id,s]));
  const byName=new Map(old.map(s=>[normName(s.demandName),s]));
  const byOrder=new Map();
  old.forEach(s=>{if(validOrder(s.demandOrder)&&!byOrder.has(String(s.demandOrder).trim()))byOrder.set(String(s.demandOrder).trim(),s)});
  const keep=['demandDate','towerName','siteCode','selectionDone','selectionDoneDate','selectionFollowups','selectionLastFollowup','selectionProblem','selectionProblemStatus','followupEnabled','isDifficultSite','currentStage','currentSituation','lastUpdate','establishDate','entryDate','pourDate','towerDate','powerDate','supportDate','completeDate','cureDays','isPaused','pauseStart','pauseReason','pauses','buildEvents','issues','currentNextAction','currentOwner','expectedFinish','updates'];
  const merged=SEED.stations.map(seed=>{
    const prev=byId.get(seed.id)||(validOrder(seed.demandOrder)?byOrder.get(String(seed.demandOrder).trim()):null)||byName.get(normName(seed.demandName));
    if(!prev)return clone(seed);
    const x=clone(seed);
    keep.forEach(k=>{
      if(prev[k]!==undefined){
        if(k==='demandDate'||k==='towerName'||k==='siteCode'){if(hasValue(prev[k]))x[k]=prev[k]}

}

function route(){const h=location.hash.slice(1)||'home'; if(h.startsWith('station/'))return {page:'station',id:decodeURIComponent(h.split('/')[1])}; if(h.startsWith('search/'))return {page:'search',q:decodeURIComponent(h.slice(7))}; return {page:h}}

function row(s,mode){let mid='',status='';if(mode==='selection'){mid=`<div class="mobilehide"><div class="lab">当前问题</div><div>${esc(s.selectionProblem||s.sourceRemark||'暂无')}</div></div>`;const typeTag=s.isDifficultSite?'<span class="tag o">疑难站址</span>':'<span class="tag">正常选址</span>';const followTag=due(s)?'<span class="tag r">3天未更新</span>':(s.selectionProblemStatus==='已解决'?'<span class="tag g">已解决</span>':'<span class="tag b">跟进中</span>');status=`${typeTag} ${followTag}`}else{if(!s.establishDate){mid=`<div class="mobilehide"><div class="lab">施工状态</div><div>待确认立项日期</div></div>`;status='<span class="tag b">待立项</span>'}else{const m=scheduleMeta(s),bd=buildDay(s);mid=`<div class="mobilehide"><div class="lab">当前主线</div><div>${esc(m.stage)}${m.next?` · 下一步 ${esc(m.next)}`:''}</div></div>`;status=`<span class="tag ${m.level==='bad'?'r':m.level==='warn'?'o':'g'}">第${bd}/48天</span>`}}

function homeRow(s,mode){if(mode==='selection'){const fd=followDays(s),when=fd===9999?'待首次跟进':(fd+'天未更新');return `<div class="hrow" data-open="${esc(s.id)}"><div><div class="name">${esc(s.demandName)}</div><div class="sub">${esc(s.operator||'—')} · ${esc(s.territory||'—')} · ${esc(s.selector||'—')}</div></div><div class="hproblem"><div class="lab">当前问题</div><div class="val">${esc(s.selectionProblem||s.sourceRemark||'暂无')}</div></div><div class="hstatus"><span class="tag ${s.isDifficultSite?'o':''}">${s.isDifficultSite?'疑难':'正常'}</span> <span class="tag r">${esc(when)}</span></div></div>`}const m=scheduleMeta(s),bd=buildDay(s);return `<div class="hrow" data-open="${esc(s.id)}"><div><div class="name">${esc(s.demandName)}</div><div class="sub">${esc(s.operator||'—')} · ${esc(s.territory||'—')}</div></div><div class="hproblem"><div class="lab">当前 / 下一步</div><div class="val">${esc(m.stage)}${m.next?' · '+esc(m.next):''}</div></div><div class="hstatus"><span class="tag ${m.level==='bad'?'r':m.level==='warn'?'o':'g'}">第${bd||'—'}/48天</span></div></div>`}
function renderHome(){navOn('home');const selections=state.stations.filter(s=>!s.selectionDone),normal=selections.filter(s=>!s.isDifficultSite),difficult=selections.filter(s=>s.isDifficultSite);const dueS=selections.filter(due).sort((a,b)=>followDays(b)-followDays(a)),dueNormal=dueS.filter(s=>!s.isDifficultSite),dueDifficult=dueS.filter(s=>s.isDifficultSite);const risks=state.stations.filter(risk).sort((a,b)=>{const A=scheduleMeta(a),B=scheduleMeta(b);const rank=x=>x.level==='bad'?0:x.level==='warn'?1:2;return rank(A)-rank(B)||(A.remain??999)-(B.remain??999)});const normalRows=dueNormal.slice(0,7).map(s=>homeRow(s,'selection')).join(''),difficultRows=dueDifficult.slice(0,7).map(s=>homeRow(s,'selection')).join(''),riskRows=risks.slice(0,8).map(s=>homeRow(s,'after')).join('');app.innerHTML=`<div class="title"><h1>今日工作台</h1><span class="muted">只看今天需要处理的站</span></div><div class="summary"><button data-go="selection">正常选址 <b>${normal.length}</b></button><button data-go="difficult">疑难站址 <b class="orange">${difficult.length}</b></button><button data-go="selection-due">正常待跟进 <b class="red">${dueNormal.length}</b></button><button data-go="difficult-due">疑难待跟进 <b class="red">${dueDifficult.length}</b></button><button data-go="after-risk">施工工期风险 <b class="orange">${risks.length}</b></button><button data-go="after">选址完成后 <b>${state.stations.filter(s=>s.selectionDone).length}</b></button></div><div class="homegrid"><section class="panel homepanel"><div class="ph"><b>正常选址 · 待跟进</b><span class="sp"></span><span class="tag ${dueNormal.length?'r':'g'}">${dueNormal.length}</span></div><div class="pb"><div class="hrows">${dueNormal.length?normalRows:'<div class="empty" style="padding:12px">暂无正常选址待跟进</div>'}</div>${dueNormal.length>7?`<div class="panel-foot"><button class="btn" data-go="selection-due">查看全部 ${dueNormal.length} 个</button></div>`:''}</div></section><section class="panel homepanel"><div class="ph"><b>疑难站址 · 待跟进</b><span class="sp"></span><span class="tag ${dueDifficult.length?'o':'g'}">${dueDifficult.length}</span></div><div class="pb"><div class="hrows">${dueDifficult.length?difficultRows:'<div class="empty" style="padding:12px">暂无疑难站址待跟进</div>'}</div>${dueDifficult.length>7?`<div class="panel-foot"><button class="btn" data-go="difficult-due">查看全部 ${dueDifficult.length} 个</button></div>`:''}</div></section>${risks.length?`<section class="panel riskwide"><div class="ph"><b>施工 · 工期风险</b><span class="sp"></span><span class="tiny muted">节点超期 / 48天临近 / 暂停</span><span class="tag r">${risks.length}</span></div><div class="pb"><div class="hrows">${riskRows}</div>${risks.length>8?`<div class="panel-foot"><button class="btn" data-go="after-risk">查看全部 ${risks.length} 个</button></div>`:''}</div></section>`:`<div class="noriskbar"><b>施工工期风险 0</b><span>当前没有需要处理的施工风险，不再占用工作台大块空间。</span></div>`}</div>`;bindCommon()}
function renderList(pool,opts={}){navOn(pool==='selection'?'selection':pool==='difficult'?'difficult':pool==='after'?'after':'');let arr;if(pool==='selection')arr=state.stations.filter(s=>!s.selectionDone&&!s.isDifficultSite);else if(pool==='difficult')arr=state.stations.filter(s=>!s.selectionDone&&s.isDifficultSite);else if(pool==='after')arr=state.stations.filter(s=>s.selectionDone);else arr=state.stations.slice();const follow=opts.follow||(opts.due?'due':'all');if(pool==='selection'||pool==='difficult'){if(follow==='due')arr=arr.filter(due);if(follow==='open')arr=arr.filter(s=>s.selectionProblemStatus!=='已解决');if(follow==='done')arr=arr.filter(s=>s.selectionProblemStatus==='已解决')}if(opts.risk)arr=arr.filter(risk);const q=(opts.q||'').trim().toLowerCase();if(q)arr=arr.filter(s=>[s.demandName,s.towerName,s.demandOrder,s.siteCode,s.territory,s.selector,s.selectionProblem,s.sourceRemark].join(' ').toLowerCase().includes(q));listMode={pool,due:follow==='due',risk:!!opts.risk,q:q,follow};const title=pool==='selection'?'选址中':pool==='difficult'?'疑难站址':pool==='after'?'选址完成后':'搜索结果';const filters=(pool==='selection'||pool==='difficult')?`<select id="fFollow"><option value="all" ${follow==='all'?'selected':''}>全部跟进状态</option><option value="due" ${follow==='due'?'selected':''}>超过3天未更新</option><option value="open" ${follow==='open'?'selected':''}>问题未解决</option><option value="done" ${follow==='done'?'selected':''}>问题已解决</option></select>`:pool==='after'?`<select id="fBuild"><option value="all">全部建设状态</option><option value="risk" ${opts.risk?'selected':''}>48天工期风险</option><option value="pending">待立项</option><option value="building">建设中</option><option value="done">整站完成</option></select>`:'';const hint=pool==='selection'?'<span class="muted tiny">这里只显示正常选址；疑难站址已单独管理</span>':pool==='difficult'?'<span class="muted tiny">长期难以落址的站点单独管理</span>':'';app.innerHTML=`<div class="title"><h1>${title}</h1><span class="muted">${arr.length} 个站</span>${hint}</div><div class="filters">${filters} function renderStation(id){const s=stationBy(id);if(!s){app.innerHTML='<div class="err">找不到该站点。</div>';return}navOn('');let body=`<div class="title"><button class="btn" id="backBtn">← 返回</button><h1>${esc(s.demandName)}</h1><span class="tag ${s.selectionDone?'b':s.isDifficultSite?'o':''}">${s.selectionDone?'选址完成后':s.isDifficultSite?'疑难站址':'选址中'}</span></div><section class="panel"><div class="ph"><b>基础信息</b><span class="sp"></span><button class="btn" id="editBaseBtn">编辑基础信息</button></div><div class="pb">${baseInfo(s)}${baseEditHtml(s)}</div></section>`;

function constructionHtml(s){if(!s.establishDate)return `<section class="panel"><div class="ph"><b>施工管理</b></div><div class="pb"><div class="alert">选址已完成，但还没有实际立项日期。录入立项日期后才启动48天总工期。</div><div class="actions"><input type="date" id="estDate"><button class="btn primary" id="saveEst">确认立项日期</button></div></div></section>`;const m=scheduleMeta(s),d=buildDay(s)||1,pct=Math.max(0,Math.min(100,d/48*100)),meter=m.level==='bad'?'bad':m.level==='warn'?'warn':'',ce=m.cureEnd;const deadlineText=m.remain<0?`已超 ${Math.abs(m.remain)} 天`:`剩余 ${m.remain} 天`;const entryState=s.entryDate?'done':(until(m.entryDue)<0?'over':m.stage==='待进场放线'?'now':'');const pourState=s.pourDate?'done':(s.entryDate&&m.pourDue&&until(m.pourDue)<0?'over':m.stage==='待浇筑'?'now':'');const cureState=s.pourDate?(ce&&until(ce)<=0?'done':'now'):'';const towerState=s.towerDate?'done':(m.stage==='待装塔'?'now':'');return `<section class="panel"><div class="ph"><b>施工时间</b><span class="sp"></span><span class="tag ${m.level==='bad'?'r':m.level==='warn'?'o':'g'}">${m.level==='bad'?'高风险':m.level==='warn'?'需关注':'正常'}</span></div><div class="pb">${s.isPaused?`<div class="pausebanner"><b>施工暂停</b><span>${esc(s.pauseReason||'未填写原因')}</span><span class="sp"></span><span>自 ${esc(s.pauseStart||'—')}</span></div>`:''}<div class="deadline"><div><div class="lab">总建设周期</div><div class="daynum ${m.level==='bad'?'red':m.level==='warn'?'orange':''}">第 ${d}/48 天</div></div><div><div class="meter ${meter}"><i style="width:${pct}%"></i></div><div class="sub">立项 ${esc(s.establishDate)} · 截止 ${esc(m.totalDue)} · ${deadlineText}</div></div><div><div class="lab">当前主线</div><div class="val">${esc(m.stage)}</div></div><div class="optional"><div class="lab">下一关键动作</div><div class="risknote">${esc(m.next||'—')}</div><div class="sub">${m.due?`最迟/目标 ${esc(m.due)}`:''}</div></div></div>${m.reason?`<div class="${m.level==='bad'?'alert':'ok'}" style="margin-top:6px">${esc(m.reason)}</div>`:''}<div class="timeline"><div class="tl done"><div class="n">1 立项</div><div class="d">实际 <strong>${esc(s.establishDate)}</strong></div><div class="d">48天截止 <strong>${esc(m.totalDue)}</strong></div></div><div class="tl ${entryState}"><div class="n">2 进场放线</div><div class="d">最迟 <strong>${esc(m.entryDue)}</strong></div><div class="d">实际 <strong>${esc(s.entryDate||'未完成')}</strong></div></div><div class="tl ${pourState}"><div class="n">3 浇筑</div><div class="d">${s.entryDate?`最迟 <strong>${esc(m.pourDue)}</strong>`:'进场后3天内'}</div><div class="d">实际 <strong>${esc(s.pourDate||'未完成')}</strong></div></div><div class="tl ${cureState}"><div class="n">4 养护</div><div class="d">周期 <strong>${esc(String(s.cureDays||28))}天</strong></div><div class="d">结束 <strong>${esc(ce||'浇筑后计算')}</strong></div></div><div class="tl ${towerState}"><div class="n">5 装塔</div><div class="d">最早 <strong>${esc(ce||'养护结束后')}</strong></div><div class="d">实际 <strong>${esc(s.towerDate||'未完成')}</strong></div></div></div><div class="parallel"><div class="box"><b>引电</b><span class="tag ${s.powerDate?'g':'b'}">${s.powerDate?'已完成':'可与装塔同步'}</span><span class="sp"></span><span>${esc(s.powerDate||'未完成')}</span></div><div class="box"><b>配套</b><span class="tag ${s.supportDate?'g':'b'}">${s.supportDate?'已完成':'穿插推进'}</span><span class="sp"></span><span>${esc(s.supportDate||'未完成')}</span></div></div><div class="nodebar"><div><div class="lab">更新节点</div><select id="nodeSel"><option value="entryDate">进场放线</option><option value="pourDate">浇筑</option><option value="towerDate">装塔</option><option value="powerDate">引电</option><option value="supportDate">配套</option><option value="completeDate">整站完成</option></select></div><div><div class="lab">实际日期</div><input type="date" id="nodeDate" value="${today()}"></div><button class="btn primary" id="saveNode">保存节点</button><div class="actions"><select id="cureDays"><option value="28" ${(s.cureDays||28)==28?'selected':''}>养护28天</option><option value="20" ${(s.cureDays||28)==20?'selected':''}>高温20天</option></select><button class="btn" id="togglePause">${s.isPaused?'恢复施工':'暂停施工'}</button></div></div></div></section>`}
function bindConstruction(s){const est=document.getElementById('saveEst');if(est)est.onclick=()=>{const d=document.getElementById('estDate').value;if(!d)return alert('请选择实际立项日期');s.establishDate=d;s.currentStage='待进场放线';save();renderStation(s.id)};const cure=document.getElementById('cureDays');if(cure)cure.onchange=()=>{s.cureDays=Number(cure.value);save();renderStation(s.id)};const sn=document.getElementById('saveNode');if(sn)sn.onclick=()=>{const k=document.getElementById('nodeSel').value,d=document.getElementById('nodeDate').value;if(!d)return alert('请选择实际日期');if(k==='pourDate'&&!s.entryDate&&!confirm('还没有录入进场日期，仍要记录浇筑吗？'))return;if(k==='towerDate'&&s.pourDate){const ce=cureEnd(s);if(ce&&d<ce&&!confirm(`养护期预计到 ${ce}，当前装塔日期早于养护结束，仍要保存吗？`))return}s[k]=d;s.currentStage=mainStage(s);save();renderStation(s.id)};const tp=document.getElementById('togglePause');if(tp)tp.onclick=()=>{if(s.isPaused){s.isPaused=false;s.pauses=s.pauses||[];s.pauses.push({start:s.pauseStart||'',end:today(),reason:s.pauseReason||''});s.pauseReason='';s.pauseStart='';save();renderStation(s.id)}else{const r=prompt('暂停原因：','');if(r===null)return;s.isPaused=true;s.pauseReason=r.trim();s.pauseStart=today();save();renderStation(s.id)}}}
function renderSchedule(){navOn('schedule');const arr=state.stations.filter(s=>s.selectionDone&&s.establishDate&&!s.completeDate).map(s=>({s,m:scheduleMeta(s)})).sort((a,b)=>{const rank=x=>x.m.level==='bad'?0:x.m.level==='warn'?1:2;return rank(a)-rank(b)||((a.m.due?until(a.m.due):999)-(b.m.due?until(b.m.due):999))});app.innerHTML=`<div class="title"><h1>施工排程</h1><span class="muted">按节点最迟日期和48天风险排序；一个施工队优先处理排在前面的站</span></div><section class="panel"><div class="ph"><b>施工优先级</b><span class="sp"></span><span class="tiny muted">进场+装塔可同日；浇筑+装塔不要同日</span></div><div class="pb">${arr.length?arr.map(({s,m})=>`<div class="scheduleline" data-open="${esc(s.id)}"><div><div class="name">${esc(s.demandName)}</div><div class="sub">${esc(s.territory||'—')} · ${esc(s.operator||'—')}</div></div><div><div class="lab">当前</div><div>${esc(m.stage)}</div></div><div class="mobilehide"><div class="lab">下一任务</div><div class="urg ${m.level==='bad'?'over':m.level==='warn'?'warn':''}">${esc(m.next||'—')}</div></div><div class="mobilehide"><div class="lab">最迟/目标</div><div>${esc(m.due||m.totalDue||'—')}</div><div class="sub">${esc(m.reason||'')}</div></div><div class="optional"><span class="tag ${m.level==='bad'?'r':m.level==='warn'?'o':'g'}">${m.level==='bad'?'高风险':m.level==='warn'?'需关注':'正常'}</span></div></div>`).join(''):'<div class="empty">目前没有已立项在建站</div>'}</div></section>`;bindCommon()}
function exportXls(arr){const headers=['需求站名','运营商','需求订单号','需求日期','需求经度','需求纬度','选址人','归属地','铁塔站名','站址编码','选址是否完成','选址类型','当前问题','问题状态','立项日期','当前主线','48天截止','进场日期','最迟进场','浇筑日期','最迟浇筑','养护天数','养护结束','装塔日期','引电日期','配套日期','整站完成','是否暂停'];const rows=arr.map(s=>{const m=scheduleMeta(s);return [s.demandName,s.operator,s.demandOrder,s.demandDate,s.demandLng,s.demandLat,s.selector,s.territory,s.towerName,s.siteCode,s.selectionDone?'是':'否',s.selectionDone?'—':(s.isDifficultSite?'疑难站址':'正常选址'),s.selectionProblem,s.selectionProblemStatus,s.establishDate,s.establishDate?m.stage:s.currentStage,s.establishDate?m.totalDue:'',s.entryDate,s.establishDate?m.entryDue:'',s.pourDate,s.entryDate?m.pourDue:'',s.cureDays||28,s.pourDate?m.cureEnd:'',s.towerDate,s.powerDate,s.supportDate,s.completeDate,s.isPaused?'是':'否']});let table='<table><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v||'')+'</td>').join('')+'</tr>').join('')+'</table>';const blob=new Blob(['\ufeff<html><meta charset="utf-8">'+table+'</html>'],{type:'application/vnd.ms-excel'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='肥西站点筛选结果_'+today()+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function bindCommon(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>go('station/'+encodeURIComponent(x.dataset.open)));document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{const g=x.dataset.go;if(g==='selection-due')renderList('selection',{follow:'due'});else if(g==='difficult-due')renderList('difficult',{follow:'due'});else if(g==='after-risk')renderList('after',{risk:true});else go(g)})}
function render(){try{const r=route();if(r.page==='home')renderHome();else if(r.page==='selection')renderList('selection');else if(r.page==='difficult')renderList('difficult');else if(r.page==='after')renderList('after');else if(r.page==='schedule')renderSchedule();else if(r.page==='station')renderStation(r.id);else if(r.page==='search')renderList('all',{q:r.q});else renderHome()}catch(e){document.getElementById('app').innerHTML='<div class="err"><b>页面加载失败</b><br>'+esc(e&&e.message||e)+'</div>';console.error(e)}}
load();const app=document.getElementById('app');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();const q=document.getElementById('globalSearch').value.trim();if(q)go('search/'+encodeURIComponent(q))};window.addEventListener('hashchange',render);window.addEventListener('error',e=>{const d=document.createElement('div');d.className='err';d.textContent='脚本错误：'+e.message;document.body.prepend(d)});render();
</script>
