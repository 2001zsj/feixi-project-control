function preEstStage(s){

  if(s.currentStage==='计划销项')return '计划销项';
  if(s.towerDate)return '已装塔，待录立项日期';
  if(s.pourDate)return '已浇筑，待录立项日期';
  if(s.entryDate)return '已进场，待录立项日期';
  return '已立项，待录入立项日期';
}

function renderHome(){navOn('home');const selections=state.stations.filter(s=>!s.selectionDone),normal=selections.filter(s=>!s.isDifficultSite),difficult=selections.filter(s=>s.isDifficultSite),completed=state.stations.filter(isComplete),pending=state.stations.filter(s=>s.selectionDone&&!s.establishRef&&!isComplete(s)),building=state.stations.filter(s=>s.selectionDone&&!!s.establishRef&&!isComplete(s));const dueS=selections.filter(due).sort((a,b)=>followDays(b)-followDays(a)),dueNormal=dueS.filter(s=>!s.isDifficultSite),dueDifficult=dueS.filter(s=>s.isDifficultSite);const risks=building.filter(risk).sort((a,b)=>{const A=scheduleMeta(a),B=scheduleMeta(b);const rank=x=>x.level==='bad'?0:x.level==='warn'?1:2;return rank(A)-rank(B)||(A.remain??999)-(B.remain??999)});const normalRows=dueNormal.slice(0,7).map(s=>homeRow(s,'selection')).join(''),difficultRows=dueDifficult.slice(0,7).map(s=>homeRow(s,'selection')).join(''),riskRows=risks.slice(0,8).map(s=>homeRow(s,'after')).join('');app.innerHTML=`<div class="title"><h1>今日工作台</h1><span class="muted">只看今天需要处理的站</span></div><div class="summary"><button data-go="selection">正常选址 <b>${normal.length}</b></button><button data-go="difficult">疑难站址 <b class="orange">${difficult.length}</b></button><button data-go="selection-due">正常待跟进 <b class="red">${dueNormal.length}</b></button><button data-go="difficult-due">疑难待跟进 <b class="red">${dueDifficult.length}</b></button><button data-go="pending">待立项 <b>${pending.length}</b></button><button data-go="building">施工中 <b>${building.length}</b></button><button data-go="building-risk">施工风险/节点提醒 <b class="orange">${risks.length}</b></button><button data-go="complete">完工站 <b class="green">${completed.length}</b></button></div><div class="homegrid"><section class="panel homepanel"><div class="ph"><b>正常选址 · 待跟进</b><span class="sp"></span><span class="tag ${dueNormal.length?'r':'g'}">${dueNormal.length}</span></div><div class="pb"><div class="hrows">${dueNormal.length?normalRows:'<div class="empty"
